<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página sencilla</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>¡Hola, mundo, también esta el grupo 13!</h1>
    <p>Esta es una página web sencilla creada para practicar HTML y CSS.</p>

    <form>
      <label for="mensaje">Escribe un mensaje:</label>
      <div class="formulario">
        <input type="text" id="mensaje" name="mensaje" placeholder="Tu mensaje">
        <button type="submit">Enviar</button>
      </div>
    </form>
  </main>
</body>
</html>
